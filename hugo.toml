# The deploy workflow overrides baseURL with the SITE_URL repository variable.
baseURL = "https://example.web.app/"
languageCode = "en-us"
title = "eventually consistent"
enableRobotsTXT = true
# Publish an issue as soon as it's committed, even if its timestamp is a few
# hours ahead of the build server's clock.
buildFuture = true

[params]
  description = "Briefings on cloud computing and AI for architects and engineers: a Cloud Digest on Mondays and Thursdays, an AI Digest on Tuesdays and Fridays."
  # Topic sections, in the order they appear in the menu and on the home page.
  # Each one is a folder under content/ with its own archive page and feed.
  mainSections = ["cloud", "ai"]

[taxonomies]
  tag = "tags"

[services.rss]
  limit = 30

# Publish feeds as /feed.xml (all topics), /cloud/feed.xml and /ai/feed.xml
# (one topic), and /tags/<tag>/feed.xml (one tag)
[outputFormats.RSS]
  baseName = "feed"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML", "RSS"]

[markup.goldmark.renderer]
  unsafe = false

[menus]
  [[menus.main]]
    name = "Latest"
    url = "/"
    weight = 1
  [[menus.main]]
    name = "Cloud"
    url = "/cloud/"
    weight = 2
  [[menus.main]]
    name = "AI"
    url = "/ai/"
    weight = 3
  [[menus.main]]
    name = "Tags"
    url = "/tags/"
    weight = 4
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 5
  [[menus.main]]
    name = "RSS"
    url = "/feed.xml"
    weight = 6
