# The deploy workflow overrides baseURL with the SITE_URL repository variable.
baseURL = "https://example.web.app/"
languageCode = "en-us"
title = "eventually consistent"
enableRobotsTXT = true
# Publish an issue as soon as it's committed, even if its timestamp is a few
# hours ahead of the build server's clock.
buildFuture = true

[params]
  description = "Twice-weekly briefing on cloud computing news and research in cloud architecture and design patterns."

[taxonomies]
  tag = "tags"

[services.rss]
  limit = 30

# Publish the feed as /feed.xml (and /digests/feed.xml, /tags/<tag>/feed.xml)
[outputFormats.RSS]
  baseName = "feed"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML", "RSS"]

[markup.goldmark.renderer]
  unsafe = false

[menus]
  [[menus.main]]
    name = "Latest"
    url = "/"
    weight = 1
  [[menus.main]]
    name = "Archive"
    url = "/digests/"
    weight = 2
  [[menus.main]]
    name = "Tags"
    url = "/tags/"
    weight = 3
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 4
  [[menus.main]]
    name = "RSS"
    url = "/feed.xml"
    weight = 5
